name: Publicar web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name cookies_milk --org com.cookiesmilk --platforms=web .
      - run: flutter pub get
      - run: |
          sudo apt-get install -y imagemagick
          convert assets/icon/icon.png -resize 32x32 web/favicon.png
          convert assets/icon/icon.png -resize 192x192 web/icons/Icon-192.png
          convert assets/icon/icon.png -resize 512x512 web/icons/Icon-512.png
          convert assets/icon/icon.png -resize 192x192 web/icons/Icon-maskable-192.png
          convert assets/icon/icon.png -resize 512x512 web/icons/Icon-maskable-512.png
      - run: |
          sed -i 's#<title>.*</title>#<title>Cookies \& Milk</title>#; s#content="cookies_milk"#content="Cookies \& Milk"#' web/index.html
          sed -i 's#"name": "cookies_milk"#"name": "Cookies \& Milk"#; s#"short_name": "cookies_milk"#"short_name": "Cookies\&Milk"#' web/manifest.json
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
